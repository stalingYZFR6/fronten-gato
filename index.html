<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Registro de Gato </title>


  <!-- Bootstrap -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >


  <!-- Bootstrap Icons -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    /* ================================
       FONDO PRINCIPAL
       ================================ */

    body {

      min-height: 100vh;

      margin: 0;

      font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      color: #f8fafc;

      background:

        linear-gradient(
          rgba(5, 5, 12, 0.88),
          rgba(10, 5, 18, 0.94)
        ),

        url("https://www.wallpaperbetter.com/wallpaper/687/512/590/neco-arc-blurred-hd-wallpaper-wswrs.jpg");

      background-size: cover;

      background-position: center;

      background-attachment: fixed;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 40px 15px;

      position: relative;

      overflow-x: hidden;
    }


    /* ================================
       DECORACIONES DE FONDO
       ================================ */

    body::before {

      content: "";

      position: fixed;

      width: 500px;
      height: 500px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(239, 68, 68, 0.18),
          transparent 70%
        );

      top: -220px;
      left: -180px;

      pointer-events: none;
    }


    body::after {

      content: "";

      position: fixed;

      width: 550px;
      height: 550px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(124, 58, 237, 0.22),
          transparent 70%
        );

      bottom: -250px;
      right: -180px;

      pointer-events: none;
    }


    /* ================================
       CONTENEDOR
       ================================ */

    .register-container {

      width: 100%;

      max-width: 1000px;

      position: relative;

      z-index: 2;
    }


    /* ================================
       TARJETA
       ================================ */

    .register-card {

      position: relative;

      overflow: hidden;

      border-radius: 28px;

      border:
        1px solid
        rgba(255, 255, 255, 0.10);

      background:
        rgba(12, 10, 20, 0.88);

      backdrop-filter: blur(20px);

      -webkit-backdrop-filter: blur(20px);

      box-shadow:

        0 35px 80px
        rgba(0, 0, 0, 0.55),

        0 0 50px
        rgba(124, 58, 237, 0.08);
    }


    /* Línea superior */

    .register-card::before {

      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 3px;

      background:
        linear-gradient(
          90deg,
          #ef4444,
          #a855f7,
          #6366f1,
          #ef4444
        );

      background-size: 200%;

      animation: gradientMove 5s linear infinite;

      z-index: 10;
    }


    @keyframes gradientMove {

      0% {
        background-position: 0%;
      }

      100% {
        background-position: 200%;
      }

    }


    /* ================================
       PANEL IZQUIERDO
       ================================ */

    .welcome-panel {

      min-height: 100%;

      position: relative;

      padding: 55px 42px;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      justify-content: center;

      background:

        linear-gradient(
          rgba(20, 7, 25, 0.80),
          rgba(10, 5, 18, 0.93)
        ),

        url("https://www.wallpaperbetter.com/wallpaper/687/512/590/neco-arc-blurred-hd-wallpaper-wswrs.jpg");

      background-size: cover;

      background-position: center;

      border-right:
        1px solid
        rgba(255,255,255,0.08);
    }


    /* Brillo rojo */

    .welcome-panel::before {

      content: "";

      position: absolute;

      width: 320px;
      height: 320px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(239,68,68,0.25),
          transparent 70%
        );

      top: -170px;
      left: -140px;
    }


    /* Brillo morado */

    .welcome-panel::after {

      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(168,85,247,0.18),
          transparent 70%
        );

      bottom: -160px;
      right: -130px;
    }


    /* ================================
       ICONO
       ================================ */

    .cat-icon {

      position: relative;

      z-index: 2;

      width: 88px;
      height: 88px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-bottom: 25px;

      border-radius: 25px;

      background:
        linear-gradient(
          135deg,
          rgba(239,68,68,0.20),
          rgba(168,85,247,0.20)
        );

      border:
        1px solid
        rgba(255,255,255,0.15);

      box-shadow:

        0 15px 35px
        rgba(0,0,0,0.35),

        inset 0 0 25px
        rgba(255,255,255,0.04);

      font-size: 40px;

      color: #fca5a5;
    }


    .cat-icon i {

      filter:
        drop-shadow(
          0 0 12px
          rgba(239,68,68,0.7)
        );
    }


    /* ================================
       TEXTO IZQUIERDO
       ================================ */

    .welcome-panel h1 {

      position: relative;

      z-index: 2;

      font-size: 2.5rem;

      font-weight: 800;

      letter-spacing: -1px;

      margin-bottom: 15px;

      color: #ffffff;

      text-shadow:
        0 3px 20px
        rgba(0,0,0,0.5);
    }


    .welcome-panel h1 span {

      color: #f87171;

      text-shadow:
        0 0 18px
        rgba(248,113,113,0.5);
    }


    .welcome-panel p {

      position: relative;

      z-index: 2;

      color:
        rgba(255,255,255,0.65);

      line-height: 1.7;

      margin-bottom: 30px;
    }


    /* ================================
       FEATURES
       ================================ */

    .feature {

      position: relative;

      z-index: 2;

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 15px;

      color:
        rgba(255,255,255,0.78);

      font-size: 0.95rem;
    }


    .feature i {

      width: 32px;
      height: 32px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 10px;

      background:
        rgba(239,68,68,0.12);

      color: #f87171;

      border:
        1px solid
        rgba(239,68,68,0.15);
    }


    /* ================================
       PANEL DEL FORMULARIO
       ================================ */

    .form-panel {

      padding: 50px 45px;

      background:
        linear-gradient(
          145deg,
          rgba(17,13,25,0.92),
          rgba(9,8,15,0.96)
        );
    }


    /* ================================
       TÍTULO
       ================================ */

    .form-title {

      margin-bottom: 35px;
    }


    .form-title h2 {

      color: #ffffff;

      font-size: 1.9rem;

      font-weight: 750;

      margin-bottom: 8px;
    }


    .form-title p {

      color: #71717a;

      margin: 0;
    }


    /* ================================
       LABELS
       ================================ */

    .form-group {

      margin-bottom: 22px;
    }


    .form-label {

      display: flex;

      align-items: center;

      gap: 8px;

      color: #d4d4d8;

      font-size: 0.88rem;

      font-weight: 650;

      margin-bottom: 8px;
    }


    .form-label i {

      color: #f87171;

      font-size: 0.95rem;

      text-shadow:
        0 0 10px
        rgba(248,113,113,0.5);
    }


    /* ================================
       INPUTS
       ================================ */

    .form-control {

      min-height: 52px;

      border-radius: 14px;

      border:
        1px solid
        rgba(255,255,255,0.09);

      background:
        rgba(255,255,255,0.045);

      color: #f4f4f5;

      padding: 12px 16px;

      transition:
        0.2s ease;
    }


    .form-control::placeholder {

      color:
        rgba(255,255,255,0.25);
    }


    .form-control:hover {

      border-color:
        rgba(248,113,113,0.3);

      background:
        rgba(255,255,255,0.06);
    }


    .form-control:focus {

      color: #ffffff;

      background:
        rgba(255,255,255,0.07);

      border-color:
        #ef4444;

      box-shadow:

        0 0 0 3px
        rgba(239,68,68,0.12),

        0 0 20px
        rgba(239,68,68,0.08);

      outline: none;
    }


    /* ================================
       INPUT FILE
       ================================ */

    input[type="file"] {

      cursor: pointer;
    }


    input[type="file"]::file-selector-button {

      border: none;

      border-radius: 9px;

      padding: 8px 12px;

      margin-right: 10px;

      color: #ffffff;

      background:
        rgba(239,68,68,0.15);

      cursor: pointer;

      transition: 0.2s ease;
    }


    input[type="file"]::file-selector-button:hover {

      background:
        rgba(239,68,68,0.25);
    }


    /* ================================
       PREVIEW
       ================================ */

    .preview-container {

      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 18px;

      background:
        rgba(255,255,255,0.035);

      border:
        1px solid
        rgba(255,255,255,0.08);

      text-align: center;
    }


    #preview {

      display: block;

      max-width: 100%;

      max-height: 220px;

      margin: auto;

      border-radius: 14px;

      object-fit: cover;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,0.4);
    }


    /* ================================
       BOTÓN
       ================================ */

    .btn-register {

      width: 100%;

      min-height: 55px;

      border: none;

      border-radius: 14px;

      color: #ffffff;

      font-size: 1rem;

      font-weight: 700;

      background:

        linear-gradient(
          135deg,
          #dc2626,
          #ef4444 50%,
          #b91c1c
        );

      box-shadow:

        0 10px 25px
        rgba(220,38,38,0.25);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }


    .btn-register:hover {

      color: #ffffff;

      transform:
        translateY(-2px);

      filter:
        brightness(1.12);

      box-shadow:

        0 15px 35px
        rgba(239,68,68,0.35);
    }


    .btn-register:active {

      transform:
        translateY(0);
    }


    .btn-register:disabled {

      opacity: 0.7;

      cursor: wait;
    }


    .btn-register i {

      margin-right: 8px;
    }


    /* ================================
       RESULTADO
       ================================ */

    #resultado {

      display: none;

      margin-top: 25px;

      padding: 18px;

      border-radius: 15px;

      font-weight: 500;

      animation:
        fadeIn 0.35s ease;
    }


    .alert-success {

      color: #86efac;

      background:
        rgba(34,197,94,0.08);

      border:
        1px solid
        rgba(34,197,94,0.20);

      border-left:
        4px solid
        #22c55e;
    }


    .alert-danger {

      color: #fca5a5;

      background:
        rgba(239,68,68,0.08);

      border:
        1px solid
        rgba(239,68,68,0.20);

      border-left:
        4px solid
        #ef4444;
    }


    .result-image {

      max-width: 100%;

      max-height: 220px;

      margin-top: 15px;

      border-radius: 14px;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,0.4);
    }


    /* ================================
       ANIMACIÓN
       ================================ */

    @keyframes fadeIn {

      from {

        opacity: 0;

        transform:
          translateY(8px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* ================================
       RESPONSIVE
       ================================ */

    @media (max-width: 767px) {

      body {

        padding: 20px 12px;
      }


      .welcome-panel {

        min-height: auto;

        padding: 40px 30px;
      }


      .welcome-panel h1 {

        font-size: 2rem;
      }


      .form-panel {

        padding: 35px 25px;
      }


      .cat-icon {

        width: 70px;

        height: 70px;

        font-size: 32px;
      }

    }

  </style>

</head>


<body>


  <div class="register-container">

    <div class="register-card">

      <div class="row g-0">


        <!-- ===================================
             PANEL NECO-ARC
             =================================== -->

        <div class="col-lg-5">

          <div class="welcome-panel">


            <div class="cat-icon">

              <i class="bi bi-stars"></i>

            </div>


            <h1>

              Registro de
              <span>gato</span>

            </h1>


            <p>

              Registra los datos de tu compañero
              felino en este oscuro y misterioso
              rincón del Reino de los Gatos.

            </p>


            <div class="feature">

              <i class="bi bi-check-lg"></i>

              <span>
                Información completa
              </span>

            </div>


            <div class="feature">

              <i class="bi bi-camera-fill"></i>

              <span>
                Fotografía del gato
              </span>

            </div>


            <div class="feature">

              <i class="bi bi-cloud-arrow-up-fill"></i>

              <span>
                Registro automático
              </span>

            </div>


          </div>

        </div>


        <!-- ===================================
             FORMULARIO
             =================================== -->

        <div class="col-lg-7">

          <div class="form-panel">


            <div class="form-title">

              <h2>
                <i
                  class="bi bi-moon-stars-fill"
                  style="color:#ef4444;"
                ></i>

                Nuevo registro
              </h2>

              <p>
                Introduce los datos de tu gato.
              </p>

            </div>


            <form id="formGato">


              <!-- NOMBRE -->

              <div class="form-group">

                <label
                  class="form-label"
                  for="nombre"
                >

                  <i class="bi bi-person-fill"></i>

                  Nombre

                </label>


                <input
                  type="text"
                  class="form-control"
                  id="nombre"
                  required
                  placeholder="Ej: Michi"
                >

              </div>


              <!-- EDAD -->

              <div class="form-group">

                <label
                  class="form-label"
                  for="edad"
                >

                  <i class="bi bi-calendar-heart"></i>

                  Edad

                </label>


                <input
                  type="number"
                  class="form-control"
                  id="edad"
                  required
                  min="0"
                  step="0.1"
                  placeholder="Ej: 2.5"
                >

              </div>


              <!-- PESO -->

              <div class="form-group">

                <label
                  class="form-label"
                  for="peso"
                >

                  <i class="bi bi-speedometer2"></i>

                  Peso (kg)

                </label>


                <input
                  type="number"
                  class="form-control"
                  id="peso"
                  required
                  min="0"
                  step="0.1"
                  placeholder="Ej: 4.2"
                >

              </div>


              <!-- RAZA -->

              <div class="form-group">

                <label
                  class="form-label"
                  for="raza"
                >

                  <i class="bi bi-stars"></i>

                  Raza

                </label>


                <input
                  type="text"
                  class="form-control"
                  id="raza"
                  required
                  placeholder="Ej: Siamés"
                >

              </div>


              <!-- IMAGEN -->

              <div class="form-group">

                <label
                  class="form-label"
                  for="imagen"
                >

                  <i class="bi bi-image-fill"></i>

                  Imagen del gato

                </label>


                <input
                  type="file"
                  class="form-control"
                  id="imagen"
                  accept="image/*"
                  required
                >


                <div
                  id="previewContainer"
                  class="preview-container"
                >

                  <img
                    id="preview"
                    alt="Vista previa del gato"
                  >

                </div>

              </div>


              <!-- BOTÓN -->

              <button
                type="submit"
                class="btn btn-register"
                id="btnRegistrar"
              >

                <i class="bi bi-cloud-upload-fill"></i>

                Registrar Gato

              </button>


            </form>


            <!-- RESULTADO -->

            <div
              id="resultado"
              class="alert"
              role="alert"
            ></div>


          </div>

        </div>

      </div>

    </div>

  </div>


  <script>


    /* =========================================
       BACKEND
       ========================================= */

    const BACKEND_URL =
      "https://backend-gatos-g0tx.onrender.com/gato";


    /* =========================================
       VISTA PREVIA
       ========================================= */

    document
      .getElementById("imagen")
      .addEventListener(
        "change",
        (e) => {

          const file =
            e.target.files[0];

          const preview =
            document.getElementById(
              "preview"
            );

          const previewContainer =
            document.getElementById(
              "previewContainer"
            );


          if (file) {

            preview.src =
              URL.createObjectURL(
                file
              );

            previewContainer.style.display =
              "block";

          }

          else {

            preview.src = "";

            previewContainer.style.display =
              "none";

          }

        }
      );


    /* =========================================
       ENVÍO DEL FORMULARIO
       ========================================= */

    document
      .getElementById("formGato")
      .addEventListener(
        "submit",
        async (e) => {

          e.preventDefault();


          const resultadoDiv =
            document.getElementById(
              "resultado"
            );


          const btnRegistrar =
            document.getElementById(
              "btnRegistrar"
            );


          resultadoDiv.style.display =
            "none";


          /* Estado de carga */

          btnRegistrar.disabled =
            true;


          btnRegistrar.innerHTML = `

            <span
              class="spinner-border
                     spinner-border-sm
                     me-2"
              role="status"
            ></span>

            Registrando...

          `;


          /* =================================
             CREAR FORMDATA
             ================================= */

          const formData =
            new FormData();


          formData.append(
            "nombre",
            document
              .getElementById("nombre")
              .value
              .trim()
          );


          formData.append(
            "edad",
            document
              .getElementById("edad")
              .value
          );


          formData.append(
            "peso",
            document
              .getElementById("peso")
              .value
          );


          formData.append(
            "raza",
            document
              .getElementById("raza")
              .value
              .trim()
          );


          /* =================================
             IMAGEN
             ================================= */

          const imagenInput =
            document.getElementById(
              "imagen"
            );


          if (
            imagenInput.files.length > 0
          ) {

            formData.append(
              "imagen",
              imagenInput.files[0]
            );

          }


          /* =================================
             PETICIÓN AL BACKEND
             ================================= */

          try {

            const respuesta =
              await fetch(
                BACKEND_URL,
                {
                  method: "POST",

                  body: formData
                }
              );


            const data =
              await respuesta.json();


            /* =================================
               REGISTRO CORRECTO
               ================================= */

            if (respuesta.ok) {

              resultadoDiv.className =
                "alert alert-success mt-4";


              resultadoDiv.innerHTML = `

                <i
                  class="bi
                         bi-check-circle-fill
                         me-2"
                ></i>

                <strong>
                  ¡Gato registrado correctamente!
                </strong>

                <br>

                ${data.mensaje || ""}


                ${
                  data.imagenUrl
                    ? `

                      <br>

                      <img
                        src="${data.imagenUrl}"
                        class="result-image"
                        alt="Imagen del gato registrado"
                      >

                    `
                    : ""
                }

              `;

            }


            /* =================================
               ERROR DEL BACKEND
               ================================= */

            else {

              resultadoDiv.className =
                "alert alert-danger mt-4";


              resultadoDiv.innerHTML = `

                <i
                  class="bi
                         bi-exclamation-triangle-fill
                         me-2"
                ></i>

                ${
                  data.mensaje ||
                  "Error al registrar el gato."
                }

              `;

            }


            resultadoDiv.style.display =
              "block";

          }


          /* =================================
             ERROR DE CONEXIÓN
             ================================= */

          catch (error) {

            console.error(error);


            resultadoDiv.className =
              "alert alert-danger mt-4";


            resultadoDiv.innerHTML = `

              <i
                class="bi bi-wifi-off me-2"
              ></i>

              Error de conexión con el servidor.

            `;


            resultadoDiv.style.display =
              "block";

          }


          /* =================================
             RESTAURAR BOTÓN
             ================================= */

          btnRegistrar.disabled =
            false;


          btnRegistrar.innerHTML = `

            <i
              class="bi
                     bi-cloud-upload-fill"
            ></i>

            Registrar Gato

          `;

        }
      );

  </script>

</body>
</html>
