<body>

    <!-- ==========================================

    <div class="floating f1">🐾</div>

    <script>

        // ==========================================
        // BACKEND
        // ==========================================

        const BACKEND_URL =
            "https://backend-gato-03dp.onrender.com/gato";


        // ==========================================
        // ELEMENTS
        // ==========================================

        const form =
            document.getElementById("formGato");

        const resultadoDiv =
            document.getElementById("resultado");

        const btnRegistrar =
            document.getElementById("btnRegistrar");


        // ==========================================
        // SUBMIT
        // ==========================================

        form.addEventListener("submit", async (e) => {

            e.preventDefault();


            const datos = {

                nombre:
                    document
                        .getElementById("nombre")
                        .value
                        .trim(),

                propietario:
                    document
                        .getElementById("propietario")
                        .value
                        .trim(),

                edad:
                    Number(
                        document
                            .getElementById("edad")
                            .value
                    ),

                peso:
                    Number(
                        document
                            .getElementById("peso")
                            .value
                    ),

                raza:
                    document
                        .getElementById("raza")
                        .value
                        .trim()

            };


            // ======================================
            // LOADING
            // ======================================

            resultadoDiv.style.display = "none";

            btnRegistrar.disabled = true;

            btnRegistrar.innerHTML =
                "⏳ REGISTRANDO MICHI...";


            try {

                const respuesta =
                    await fetch(
                        BACKEND_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(datos)
                        }
                    );


                const data =
                    await respuesta.json();


                // ==================================
                // SUCCESS
                // ==================================

                if (respuesta.ok) {

                    resultadoDiv.className =
                        "success";

                    resultadoDiv.innerHTML = `
                        😺 <strong>¡NECO REGISTRADO!</strong>
                        <br><br>
                        ${data.mensaje ||
                        "El gato ha sido añadido correctamente a la NECO DATABASE."}
                    `;

                    resultadoDiv.style.display =
                        "block";


                    form.reset();

                    btnRegistrar.innerHTML =
                        "✨ REGISTRAR OTRO MICHI";

                }


                // ==================================
                // BACKEND ERROR
                // ==================================

                else {

                    resultadoDiv.className =
                        "error";

                    resultadoDiv.innerHTML = `
                        😿 <strong>ERROR 404: MICHI NO REGISTRADO</strong>
                        <br><br>
                        ${data.mensaje ||
                        "El servidor rechazó el registro."}
                    `;

                    resultadoDiv.style.display =
                        "block";

                    btnRegistrar.innerHTML =
                        "🐾 REGISTRAR AL MICHI";
                }

            }


            // ======================================
            // CONNECTION ERROR
            // ======================================

            catch (error) {

                console.error(error);

                resultadoDiv.className =
                    "error";

                resultadoDiv.innerHTML = `
                    💀 <strong>NECO SERVER DOWN</strong>
                    <br><br>
                    No se pudo contactar con el backend.
                    <br>
                    El michi está atrapado en otra dimensión.
                `;

                resultadoDiv.style.display =
                    "block";

                btnRegistrar.innerHTML =
                    "🐾 INTENTAR NUEVAMENTE";

            }


            btnRegistrar.disabled = false;

        });

    </script>

</body>

</html>
