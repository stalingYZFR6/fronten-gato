<script>

  // =====================================================
  // URL DEL BACKEND
  // =====================================================

  const BACKEND_URL =
    "https://backend-gato-03dp.onrender.com";


  // =====================================================
  // ELEMENTOS
  // =====================================================

  const formGato =
    document.getElementById("formGato");

  const gatoId =
    document.getElementById("gatoId");

  const nombre =
    document.getElementById("nombre");

  const edad =
    document.getElementById("edad");

  const peso =
    document.getElementById("peso");

  const raza =
    document.getElementById("raza");

  const imagen =
    document.getElementById("imagen");

  const preview =
    document.getElementById("preview");

  const btnSubmit =
    document.getElementById("btnSubmit");

  const btnCancelar =
    document.getElementById("btnCancelar");

  const resultadoDiv =
    document.getElementById("resultado");


  // =====================================================
  // VISTA PREVIA DE IMAGEN
  // =====================================================

  imagen.addEventListener("change", (e) => {

    const file = e.target.files[0];

    if (file) {

      preview.src =
        URL.createObjectURL(file);

      preview.style.display =
        "block";

    }

  });


  // =====================================================
  // SUBMIT DEL FORMULARIO
  // REGISTRAR O ACTUALIZAR
  // =====================================================

  formGato.addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();

      resultadoDiv.style.display =
        "none";


      const formData =
        new FormData();


      formData.append(
        "nombre",
        nombre.value.trim()
      );

      formData.append(
        "edad",
        edad.value
      );

      formData.append(
        "peso",
        peso.value
      );

      formData.append(
        "raza",
        raza.value.trim()
      );


      // =================================================
      // IMAGEN
      // =================================================

      if (imagen.files.length > 0) {

        formData.append(
          "imagen",
          imagen.files[0]
        );

      }


      // =================================================
      // DETERMINAR SI ES REGISTRO O EDICIÓN
      // =================================================

      const id =
        gatoId.value;


      const esEdicion =
        id !== "";


      const url =
        esEdicion
          ? `${BACKEND_URL}/gato/${id}`
          : `${BACKEND_URL}/gato`;


      const metodo =
        esEdicion
          ? "PUT"
          : "POST";


      try {

        btnSubmit.disabled = true;

        btnSubmit.textContent =
          esEdicion
            ? "Actualizando..."
            : "Registrando...";


        const respuesta =
          await fetch(
            url,
            {
              method: metodo,
              body: formData
            }
          );


        const data =
          await respuesta.json();


        if (!respuesta.ok) {

          throw new Error(
            data.mensaje ||
            "Ocurrió un error."
          );

        }


        // =================================================
        // MENSAJE DE ÉXITO
        // =================================================

        resultadoDiv.className =
          "alert alert-success mt-4";

        resultadoDiv.textContent =
          data.mensaje;


        resultadoDiv.style.display =
          "block";


        // =================================================
        // LIMPIAR FORMULARIO
        // =================================================

        limpiarFormulario();


        // =================================================
        // RECARGAR GATOS
        // =================================================

        await cargarGatos();


      } catch (error) {

        console.error(
          "Error:",
          error
        );


        resultadoDiv.className =
          "alert alert-danger mt-4";

        resultadoDiv.textContent =
          error.message ||
          "Error de conexión con el servidor.";

        resultadoDiv.style.display =
          "block";

      } finally {

        btnSubmit.disabled =
          false;

        btnSubmit.textContent =
          "Registrar Gato";

      }

    }
  );


  // =====================================================
  // CARGAR GATOS
  // =====================================================

  async function cargarGatos() {

    const contenedor =
      document.getElementById(
        "listaGatos"
      );


    contenedor.innerHTML = `
      <div class="col-12 loading">
        Cargando gatos...
      </div>
    `;


    try {

      const respuesta =
        await fetch(
          `${BACKEND_URL}/gatos`
        );


      const gatos =
        await respuesta.json();


      if (!respuesta.ok) {

        throw new Error(
          gatos.mensaje ||
          "Error al obtener gatos"
        );

      }


      // =================================================
      // NO HAY GATOS
      // =================================================

      if (gatos.length === 0) {

        contenedor.innerHTML = `
          <div class="col-12">

            <div class="alert alert-info text-center">

              Aún no hay gatos registrados.

            </div>

          </div>
        `;

        return;

      }


      // =================================================
      // CREAR TARJETAS
      // =================================================

      contenedor.innerHTML =
        gatos.map(
          (gato) => `

            <div class="col-12 col-sm-6 col-xl-4">

              <div class="card gato-card h-100">

                <img
                  src="${gato.imagenUrl}"
                  class="card-img-top gato-img"
                  alt="${gato.nombre}"
                  onerror="
                    this.src='https://via.placeholder.com/400x300?text=Sin+imagen'
                  "
                >

                <div class="card-body">

                  <h5 class="card-title mb-1">
                    ${gato.nombre}
                  </h5>

                  <p class="card-text mb-1">

                    <small class="text-muted">

                      ${gato.raza}
                      ·
                      ${gato.edad} años
                      ·
                      ${gato.peso} kg

                    </small>

                  </p>

                  <p class="card-text">

                    <small class="text-muted">

                      Registrado:
                      ${
                        new Date(gato.fecha)
                          .toLocaleDateString("es-ES")
                      }

                    </small>

                  </p>


                  <!-- =================================
                       BOTÓN ACTUALIZAR
                  ================================== -->

                  <button
                    type="button"
                    class="btn btn-outline-primary btn-sm w-100"
                    onclick="editarGato('${gato.id}')"
                  >
                    Actualizar
                  </button>

                </div>

              </div>

            </div>

          `
        ).join("");


    } catch (error) {

      console.error(
        "Error:",
        error
      );


      contenedor.innerHTML = `

        <div class="col-12">

          <div class="alert alert-danger text-center">

            Error al cargar los gatos.
            Intenta de nuevo.

          </div>

        </div>

      `;

    }

  }


  // =====================================================
  // EDITAR GATO
  // =====================================================

  window.editarGato = async function(id) {

    try {

      // Obtener todos los gatos
      const respuesta =
        await fetch(
          `${BACKEND_URL}/gatos`
        );


      const gatos =
        await respuesta.json();


      if (!respuesta.ok) {

        throw new Error(
          "No se pudieron obtener los gatos."
        );

      }


      // Buscar el gato seleccionado
      const gato =
        gatos.find(
          (g) => g.id === id
        );


      if (!gato) {

        throw new Error(
          "No se encontró el gato."
        );

      }


      // =================================================
      // LLENAR FORMULARIO
      // =================================================

      gatoId.value =
        gato.id;

      nombre.value =
        gato.nombre;

      edad.value =
        gato.edad;

      peso.value =
        gato.peso;

      raza.value =
        gato.raza;


      // =================================================
      // MOSTRAR IMAGEN ACTUAL
      // =================================================

      if (gato.imagenUrl) {

        preview.src =
          gato.imagenUrl;

        preview.style.display =
          "block";

      }


      // =================================================
      // CAMBIAR MODO DEL FORMULARIO
      // =================================================

      btnSubmit.textContent =
        "Actualizar Gato";

      btnSubmit.classList.remove(
        "btn-primary"
      );

      btnSubmit.classList.add(
        "btn-success"
      );


      btnCancelar.classList.remove(
        "d-none"
      );


      // =================================================
      // SCROLL HACIA EL FORMULARIO
      // =================================================

      document
        .getElementById("formGato")
        .scrollIntoView({
          behavior: "smooth",
          block: "start"
        });


    } catch (error) {

      console.error(
        "Error al editar:",
        error
      );


      resultadoDiv.className =
        "alert alert-danger mt-4";

      resultadoDiv.textContent =
        error.message;

      resultadoDiv.style.display =
        "block";

    }

  };


  // =====================================================
  // CANCELAR EDICIÓN
  // =====================================================

  btnCancelar.addEventListener(
    "click",
    () => {

      limpiarFormulario();

      resultadoDiv.style.display =
        "none";

    }
  );


  // =====================================================
  // LIMPIAR FORMULARIO
  // =====================================================

  function limpiarFormulario() {

    formGato.reset();

    gatoId.value = "";

    preview.src = "";

    preview.style.display =
      "none";


    btnSubmit.textContent =
      "Registrar Gato";


    btnSubmit.classList.remove(
      "btn-success"
    );

    btnSubmit.classList.add(
      "btn-primary"
    );


    btnCancelar.classList.add(
      "d-none"
    );

  }


  // =====================================================
  // BOTÓN ACTUALIZAR LISTA
  // =====================================================

  document
    .getElementById("btnRecargar")
    .addEventListener(
      "click",
      cargarGatos
    );


  // =====================================================
  // CARGAR AL INICIAR
  // =====================================================

  cargarGatos();

</script>
